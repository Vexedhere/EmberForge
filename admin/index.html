<style>
:root{--bg:#07060b;--panel:#0e0b14;--panel2:#12101a;--line:#ffffff12;--muted:#91899d;--text:#f8f5ff;--purple:#9b5cff;--purple2:#c084fc;--gold:#f4c95d;--green:#63e6a0;--red:#ff718d}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:radial-gradient(900px 500px at 5% -10%,#9b5cff26,transparent 65%),radial-gradient(800px 500px at 100% 100%,#f4c95d0c,transparent 60%);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.shell{display:flex;min-height:100vh}.side{width:245px;position:fixed;inset:0 auto 0 0;border-right:1px solid var(--line);background:#09070eeb;backdrop-filter:blur(18px);padding:24px 15px;z-index:10}.brand{display:flex;align-items:center;gap:11px;padding:4px 9px 28px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;font-size:12px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--gold));color:#08060b;box-shadow:0 8px 28px #9b5cff38}.side-label{font-size:9px;letter-spacing:.18em;color:#625b6b;font-weight:900;padding:15px 10px 7px}.navitem{display:flex;gap:11px;align-items:center;padding:12px 11px;border:1px solid transparent;border-radius:11px;color:#9c94a8;font-size:11px;font-weight:800}.navitem.active,.navitem:hover{background:#9b5cff12;border-color:#9b5cff28;color:#fff}.bottom{position:absolute;bottom:20px;left:15px;right:15px}.logout{width:100%;background:#ffffff06;border:1px solid var(--line);color:#aaa1b4;padding:11px;border-radius:11px;font-size:10px;font-weight:900}
.main{margin-left:245px;width:calc(100% - 245px);padding:28px 34px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.eyebrow{font-size:9px;color:var(--purple2);letter-spacing:.18em;font-weight:950;text-transform:uppercase}.top h1{margin:6px 0 5px;font-size:32px;letter-spacing:-.04em}.muted{color:var(--muted);font-size:11px;line-height:1.7}.live{display:flex;align-items:center;gap:8px;border:1px solid #63e6a026;background:#63e6a00a;padding:9px 12px;border-radius:999px;color:#9bffc4;font-size:9px;font-weight:900}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px}.stat{background:linear-gradient(145deg,#ffffff08,#ffffff02);border:1px solid var(--line);border-radius:16px;padding:18px}.stat small{color:#746d7e;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.stat strong{display:block;font-size:25px;margin-top:8px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.panel{border:1px solid var(--line);background:#0d0a14d9;border-radius:19px;padding:21px;box-shadow:0 25px 80px #0004}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel h2{margin:0;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;color:#777080;font-size:9px;font-weight:950;letter-spacing:.12em;margin:0 0 7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#09070e;color:#fff;outline:none;border-radius:11px;padding:12px;font-size:11px}.field textarea{min-height:105px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9b5cff66;box-shadow:0 0 0 3px #9b5cff0c}.full{grid-column:1/-1}.upload{border:1px dashed #9b5cff45;border-radius:12px;padding:16px;background:#9b5cff06;transition:.18s}.upload:hover,.upload.drag{border-color:#c084fc;background:#9b5cff12}.droptext{font-size:10px;color:#a9a1b3;text-align:center}.droptext u{color:#c084fc;cursor:pointer}.hint{font-size:8px;color:#655e6e;margin-top:7px}.publish{margin-top:17px;width:100%;border:0;border-radius:11px;padding:13px;background:linear-gradient(135deg,var(--purple),#7040c9);color:#fff;font-size:10px;font-weight:950;box-shadow:0 10px 30px #9b5cff25}.status{display:none;margin-top:12px;padding:11px;border-radius:10px;font-size:10px}.success{display:block;background:#63e6a00d;border:1px solid #63e6a024;color:#9dffc6}.error{display:block;background:#ff718d0d;border:1px solid #ff718d24;color:#ff9aac}
.preview{position:sticky;top:20px}.previewbox{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#09070e;margin-top:15px}.previewimg{height:145px;display:grid;place-items:center;background:radial-gradient(circle,#9b5cff20,transparent 60%),#110d18;font-size:45px}.previewbody{padding:15px}.previewtitle{font-size:16px;font-weight:950}.previewprice{color:var(--gold);font-weight:950;margin-top:8px}.catalog{margin-top:18px}.product{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.thumb{width:45px;height:45px;object-fit:cover;border-radius:10px;background:#17121e}.productname{font-size:11px;font-weight:900}.productmeta{color:#777080;font-size:9px;margin-top:4px}.pill{margin-left:auto;font-size:8px;font-weight:950;color:#cdb6ff;border:1px solid #9b5cff2b;background:#9b5cff0c;padding:5px 7px;border-radius:999px}.loginwrap{max-width:440px;margin:12vh auto;padding:20px}.loginbox{border:1px solid var(--line);background:#0d0a14e8;border-radius:22px;padding:30px;box-shadow:0 30px 100px #0008}.loginbox h1{font-size:28px;margin:8px 0}.loginmark{text-align:center;margin-bottom:25px}.loginmark .logo{margin:auto}.hidden{display:none}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.preview{position:static}.stats{grid-template-columns:1fr 1fr}}@media(max-width:760px){.side{width:65px;padding:18px 9px}.brand span:last-child,.side-label,.navitem span{display:none}.brand{padding:4px 4px 28px}.main{margin-left:65px;width:calc(100% - 65px);padding:20px 14px 45px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr}.top{align-items:flex-start}.top .live{display:none}}
</style>
</head>

<script>
const SUPABASE_URL="https://nzaelikbjumaidaombmp.supabase.co";
const SUPABASE_KEY="sb_publishable_xI4i15jxoh44D8USeKLLKQ_daeg0gtt";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.getElementById("root");let session=null;async function getProducts(admin=false){let q=sb.from("products").select("*").order("created_at",{ascending:false});if(!admin)q=q.eq("published",true).neq("category","ranks");const {data,error}=await q;if(error)throw error;return (data||[]).map(p=>({...p,image:p.image_path?sb.storage.from("store-resources").getPublicUrl(p.image_path).data.publicUrl:"",file:p.file_path?sb.storage.from("store-resources").getPublicUrl(p.file_path).data.publicUrl:"",price:Number(p.price||0),createdAt:p.created_at}));}
async function uploadFile(file,path){const {error}=await sb.storage.from("store-resources").upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"});if(error)throw error;}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function login(){
root.innerHTML='<div class="loginwrap"><div class="loginbox"><div class="loginmark"><div class="logo">M</div><div class="eyebrow" style="margin-top:13px">MYTHICAL STUDIOS</div></div><h1>Store Admin</h1><p class="muted">Sign in to manage your Minecraft store catalogue.</p><form id="loginForm"><div class="field" style="margin-top:20px"><label>USERNAME</label><input id="username" autocomplete="username" required placeholder="Admin email" type="email"></div><div class="field" style="margin-top:13px"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></div><button class="publish" type="submit">ENTER CONTROL CENTER →</button><div id="loginStatus" class="status"></div></form></div></div>';
document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();const s=document.getElementById("loginStatus");try{const {data,error}=await sb.auth.signInWithPassword({email:username.value.trim(),password:password.value});if(error)throw error;session=data.session;sessionStorage.setItem("mythical_admin_session","1");dashboard()}catch(x){s.textContent=x.message;s.className="status error"}}
async function dashboard(){
root.innerHTML='<div class="shell"><aside class="side"><a class="brand" href="/"><span class="logo">M</span><span>Mythical Studios</span></a><div class="side-label">CONTROL</div><a class="navitem active" href="#dashboard">▦ <span>Dashboard</span></a><a class="navitem" href="#products">◇ <span>Products</span></a><a class="navitem" href="https://store.mythicalstudios.online/" target="_blank">↗ <span>Live Store</span></a><div class="bottom"><button class="logout" id="logout">LOG OUT</button></div></aside><main class="main"><header class="top"><div><div class="eyebrow">MYTHICAL STUDIOS / CONTROL CENTER</div><h1>Add a resource</h1><div class="muted">Choose a category, drop your file, add the title and description, then publish.</div></div><div class="live"><i class="dot"></i> STORE ONLINE</div></header><div class="stats"><div class="stat"><small>Total Products</small><strong id="total">—</strong></div><div class="stat"><small>Ranks</small><strong id="ranks">—</strong></div><div class="stat"><small>Other Items</small><strong id="other">—</strong></div></div><div class="layout"><section class="panel"><div class="panelhead"><div><div class="eyebrow">CATALOGUE</div><h2 style="margin-top:5px">Publish something new</h2></div></div><form id="productForm" enctype="multipart/form-data"><div class="grid"><div class="field"><label>CATEGORY</label><select name="category" required><option value="schematic">🧱 Schematics</option><option value="development">⚙️ Server Development</option><option value="ranks">👑 MC Ranks (private)</option></select></div><div class="field"><label>PRODUCT TITLE</label><input name="title" required placeholder="e.g. LEGENDARY CASTLE"></div><div class="field"><label>PRICE (INR)</label><input name="price" type="number" min="0" step="1" required placeholder="499"></div><div class="field"><label>PRODUCT IMAGE</label><div class="upload dropzone" data-input="imageInput"><div class="droptext">Drop image here or <u>browse</u></div><input id="imageInput" name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div><div class="hint">PNG, JPG, WEBP or GIF</div></div><div class="field full"><label>RESOURCE FILE</label><div class="upload dropzone" data-input="fileInput"><div class="droptext">Drop resource file here or <u>browse</u></div><input id="fileInput" name="file" type="file" accept=".schem,.schematic,.litematic,.zip,.rar,.mcworld,.mcpack,.pdf,.png,.jpg,.jpeg,.webp" hidden></div><div class="hint">Schematic, ZIP, Litematic, MCWorld, PDF, image, etc. Max 50 MB.</div></div><div class="field full"><label>DESCRIPTION</label><textarea name="description" placeholder="Tell customers what they receive..."></textarea></div><div class="field full"><label>FEATURES — ONE PER LINE</label><textarea name="features" placeholder="Premium access\nInstant delivery\nExclusive perks"></textarea></div></div><button class="publish" type="submit">＋ PUBLISH RESOURCE</button><div id="status" class="status"></div></form></section><aside class="preview"><div class="panel"><div class="eyebrow">LIVE PREVIEW</div><div class="previewbox"><div class="previewimg" id="previewImg">👑</div><div class="previewbody"><div class="previewtitle" id="previewTitle">Your product</div><div class="previewprice" id="previewPrice">₹0</div><div class="muted" id="previewDesc" style="margin-top:7px">Fill in the form to preview your listing.</div></div></div></div></aside></div><section class="panel catalog" id="products"><div class="panel" style="margin-bottom:18px;background:#9b5cff08"><div class="panelhead"><div><div class="eyebrow">20-SCHEMATIC CATALOGUE</div><h2 style="margin-top:5px">Import / Repair the starter schematics</h2><div class="muted" style="margin-top:6px">Choose your ZIP containing 001–020 .schem files. This creates or repairs all 20 database records, forces category=schematic and published=true, sets the correct order and prices, and uploads the matching files.</div></div></div><div class="upload" style="margin-top:12px"><div class="droptext">Choose <b>schematics_001_020.zip</b> <u id="zipBrowse">browse</u></div><input id="zipInput" type="file" accept=".zip" hidden></div><button id="importZip" class="publish" style="margin-top:12px">IMPORT / REPAIR 20 SCHEMATICS</button><div id="importStatus" class="status"></div></div><div class="panelhead"><div><div class="eyebrow">PUBLISHED RESOURCES</div><h2 style="margin-top:5px">Published Resources</h2></div></div><div id="catalogList"><div class="muted">Loading...</div></div></section></main></div>';
document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();sessionStorage.clear();session=null;login()};
const form=document.getElementById("productForm");form.onsubmit=submitProduct;
["title","price","description"].forEach(n=>document.querySelector('[name="'+n+'"]').addEventListener("input",preview));
document.querySelector('[name="category"]').addEventListener("change",preview);document.querySelector('[name="image"]').addEventListener("change",previewImage);setupDropzone("imageInput");setupDropzone("fileInput");
loadCatalog();preview();document.getElementById("importZip").onclick=importStarterZip;document.getElementById("zipBrowse").onclick=()=>document.getElementById("zipInput").click();document.getElementById("zipInput").addEventListener("change",()=>{const f=document.getElementById("zipInput").files[0];if(f){const s=document.getElementById("importStatus");s.className="status";s.textContent="Selected: "+f.name;}});
}
}
function preview(){const f=document.getElementById("productForm");if(!f)return;document.getElementById("previewTitle").textContent=f.title.value||"Your product";document.getElementById("previewPrice").textContent="₹"+Number(f.price.value||0).toLocaleString("en-IN");document.getElementById("previewDesc").textContent=f.description.value||"Fill in the form to preview your listing.";document.getElementById("previewImg").textContent=f.category.value==="ranks"?"👑":f.category.value==="schematic"?"🧱":"⚙️"}
function setupDropzone(id){const input=document.getElementById(id),zone=input.closest(".dropzone");zone.onclick=e=>{if(e.target!==input)input.click()};["dragenter","dragover"].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.add("drag")}));["dragleave","drop"].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.remove("drag")}));zone.addEventListener("drop",e=>{if(e.dataTransfer.files.length){input.files=e.dataTransfer.files;input.dispatchEvent(new Event("change",{bubbles:true}))}})}
function previewImage(e){const file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file);document.getElementById("previewImg").innerHTML='<img src="'+url+'" style="width:100%;height:100%;object-fit:cover">'}
async function importStarterZip(){const btn=document.getElementById("importZip"),status=document.getElementById("importStatus"),input=document.getElementById("zipInput");btn.disabled=true;status.className="status";status.textContent="Reading ZIP...";try{const file=input.files[0];if(!file)throw Error("Choose your 20-schematic ZIP first.");const zip=await JSZip.loadAsync(await file.arrayBuffer());const wanted={"001":{title:"001 - Fantasy Kingdom Spawn",price:499},"002":{title:"002 - Roman Colosseum",price:399},"003":{title:"003 - Merchant Marketplace",price:299},"004":{title:"004 - Sky Islands Lobby",price:449},"005":{title:"005 - Olympus Temple Spawn",price:599},"006":{title:"006 - Candyland BedWars",price:499},"007":{title:"007 - Void Abyss",price:549},"008":{title:"008 - Dwarven Mines BedWars",price:499},"009":{title:"009 - Sakura Islands",price:399},"010":{title:"010 - Desert Pharaoh",price:449},"011":{title:"011 - Starter Base Village",price:249},"012":{title:"012 - Medieval Town",price:449},"013":{title:"013 - Survival Trading Hall",price:299},"014":{title:"014 - Automatic Farm District",price:349},"015":{title:"015 - Mountain Kingdom",price:499},"016":{title:"016 - Japanese Survival Village",price:449},"017":{title:"017 - Underground Bunker",price:349},"018":{title:"018 - Giant Treehouse Base",price:399},"019":{title:"019 - Ocean Monument Base",price:499},"020":{title:"020 - Nether Fortress Base",price:549}};const byNo={};for(const f of Object.values(zip.files)){if(f.dir)continue;const name=f.name.split("/").pop(),m=name.match(/^(\d{3})[_-].+\.schem$/i);if(m&&wanted[m[1]])byNo[m[1]]=f}const missing=Object.keys(wanted).filter(n=>!byNo[n]);if(missing.length)throw Error("ZIP is missing: "+missing.join(", "));let done=0;for(const n of Object.keys(wanted)){const meta=wanted[n],entry=byNo[n],name=entry.name.split("/").pop(),id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/-schem$/,"").replace(/^-|-$/g,""),path="files/schematics/"+id+".schem";const blob=await entry.async("blob");const up=await sb.storage.from("store-resources").upload(path,blob,{upsert:true,contentType:"application/octet-stream"});if(up.error)throw up.error;const row={id,title:meta.title,description:"Premium Minecraft schematic from the Mythical Studios starter collection.",category:"schematic",price:meta.price,image_path:null,file_path:path,features:["WorldEdit schematic (.schem)","Instant digital download","Mythical Studios starter collection"],published:true};const existing=await sb.from("products").select("id").eq("id",id).maybeSingle();if(existing.error)throw existing.error;const result=existing.data?await sb.from("products").update(row).eq("id",id):await sb.from("products").insert(row);if(result.error)throw result.error;done++;status.textContent="Repaired "+done+" / 20..."}status.textContent="✓ Repaired/imported all 20 schematics. They are published in 001 → 020 order.";status.className="status success";await loadCatalog()}catch(x){status.textContent=x.message||"Import failed";status.className="status error"}finally{btn.disabled=false}}
async function submitProduct(e){e.preventDefault();const s=document.getElementById("status");s.className="status";s.textContent="Publishing resource...";const fd=new FormData(e.target);try{const category=fd.get("category"),title=String(fd.get("title")||"").trim(),price=Number(fd.get("price")||0),description=String(fd.get("description")||"").trim(),features=String(fd.get("features")||"").split("\n").map(x=>x.trim()).filter(Boolean);if(!title)throw Error("Title is required");const id=title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36);const image=fd.get("image"),file=fd.get("file");let image_path=null,file_path=null;if(image&&image.size){image_path="images/"+id+"/"+image.name;await uploadFile(image,image_path)}if(file&&file.size){file_path="files/"+id+"/"+file.name;await uploadFile(file,file_path)}const {data,error}=await sb.from("products").insert({id,title,description,category,price,image_path,file_path,features,published:true}).select("*").single();if(error)throw error;s.textContent="✓ "+data.title+" is live on the store";s.className="status success";e.target.reset();preview();loadCatalog()}catch(x){s.textContent=x.message;s.className="status error"}}
async function loadCatalog(){const el=document.getElementById("catalogList");try{const items=await getProducts(true);document.getElementById("total").textContent=items.length;document.getElementById("ranks").textContent=items.filter(x=>x.category==="ranks").length;document.getElementById("other").textContent=items.filter(x=>x.category!=="ranks").length;el.innerHTML=items.map(p=>'<div class="product">'+(p.image?'<img class="thumb" src="'+esc(p.image)+'">':'<div class="thumb" style="display:grid;place-items:center">✦</div>')+'<div><div class="productname">'+esc(p.title)+'</div><div class="productmeta">₹'+Number(p.price).toLocaleString("en-IN")+' • '+esc(p.category)+'</div></div><span class="pill">LIVE</span></div>').join("")||'<div class="muted">No products published yet.</div>'}catch(x){el.innerHTML='<div class="status error" style="display:block">'+esc(x.message)+'</div>'}}
sb.auth.getSession().then(({data})=>{if(data.session){session=data.session;dashboard()}else login()});
