<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmberForge — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07060b;color:#f7f4fb;font-family:Inter,system-ui,sans-serif;background-image:radial-gradient(800px 500px at 10% 0,rgba(155,92,255,.2),transparent 65%),radial-gradient(700px 500px at 90% 100%,rgba(244,201,93,.08),transparent 65%)}button,input{font:inherit}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(920px,100%);border:1px solid rgba(255,255,255,.09);border-radius:24px;background:rgba(14,11,21,.9);box-shadow:0 30px 100px #0008;padding:30px}.login{width:min(430px,100%);margin:auto}.brand{font-size:12px;font-weight:900;letter-spacing:.16em;color:#c084fc;text-transform:uppercase}.login h1{font-size:34px;margin:12px 0 7px}.muted{color:#aaa2b1;font-size:13px;line-height:1.7}.field{margin:18px 0}.field label{display:block;color:#aaa2b1;font-size:11px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:13px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:#0a0810;color:white;outline:none}.field input:focus{border-color:#9b5cff}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#9b5cff,#7040c9);color:white;font-weight:900;cursor:pointer}.error{min-height:18px;color:#ff7894;font-size:11px;font-weight:800;margin-top:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:26px}.logout{padding:9px 12px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.04);color:#ddd;font-size:11px;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid rgba(255,255,255,.08);border-radius:17px;padding:20px;background:rgba(255,255,255,.025)}.card .icon{font-size:28px}.card h3{margin:12px 0 7px}.card p{margin:0;color:#9e96a8;font-size:12px;line-height:1.7}.status{display:inline-block;margin-top:13px;padding:6px 9px;border-radius:999px;background:rgba(101,230,160,.08);color:#65e6a0;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.note{margin-top:18px;border:1px solid rgba(244,201,93,.18);background:rgba(244,201,93,.05);padding:14px;border-radius:12px;color:#bdb4c3;font-size:11px;line-height:1.7}@media(max-width:700px){.grid{grid-template-columns:1fr}.panel{padding:22px}}
</style></head>
<body><div class="wrap"><section class="panel" id="app"></section></div>
<script>
const accounts={
  "Chethan":"6350e6b1789f93cd47931f239eda4005b22c28e5e22c9e8c2b1312090951a35b",
  "Vijay":"0c2ab274f16e656b30bfaa16eea4afc1dfe206a35f1e77d533797ff97c8993cb"
};
const app=document.getElementById("app");
async function sha(value){const bytes=new TextEncoder().encode(value);const hash=await crypto.subtle.digest("SHA-256",bytes);return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function login(){
app.innerHTML='<div class="login"><div class="brand">EMBERFORGE / ADMIN</div><h1>Admin Login</h1><p class="muted">Sign in to access the EmberForge store administration panel.</p><form id="form"><div class="field"><label>USERNAME</label><input id="user" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="pass" type="password" autocomplete="current-password" required></div><button class="btn">Sign In</button><div class="error" id="error"></div></form></div>';
document.getElementById("form").onsubmit=async e=>{e.preventDefault();const u=document.getElementById("user").value.trim();const p=document.getElementById("pass").value;const ok=accounts[u] && (await sha(p)===accounts[u]);if(ok){sessionStorage.setItem("emberforge_admin",u);dashboard(u)}else document.getElementById("error").textContent="Invalid username or password."}
}
function dashboard(user){
app.innerHTML='<div class="top"><div><div class="brand">EMBERFORGE / ADMIN</div><h1 style="margin:8px 0 4px">Welcome, '+user+'</h1><div class="muted">Store administration dashboard</div></div><button class="logout" id="logout">Log out</button></div><div class="grid"><div class="card"><div class="icon">👑</div><h3>MC Ranks</h3><p>Manage and review the Minecraft rank catalogue.</p><span class="status">7 products</span></div><div class="card"><div class="icon">🧱</div><h3>Schematics</h3><p>Category is ready for future schematic releases.</p><span class="status">Coming soon</span></div><div class="card"><div class="icon">⚙️</div><h3>Server Development</h3><p>Development services are currently being prepared.</p><span class="status">In development</span></div></div><div class="note">Discord: <b>discord.gg/tzVTqK8Yt</b><br>This admin UI is hosted as a static website. It is a dashboard gate, not server-side authentication.</div><div style="margin-top:20px"><a class="logout" style="display:inline-block;text-decoration:none" href="/">← Back to Store</a></div>';
document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("emberforge_admin");login()}
}
sessionStorage.getItem("emberforge_admin")?dashboard(sessionStorage.getItem("emberforge_admin")):login();
</script></body></html>
