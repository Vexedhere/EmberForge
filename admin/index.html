<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mythical Studios — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07060b;color:#f7f4fb;font-family:Inter,system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(900px 500px at 10% 0,rgba(155,92,255,.2),transparent 65%),radial-gradient(700px 500px at 90% 100%,rgba(244,201,93,.08),transparent 65%)}button,input,textarea,select{font:inherit}.wrap{max-width:1080px;margin:auto;padding:30px 18px}.panel{border:1px solid rgba(255,255,255,.08);border-radius:24px;background:rgba(14,11,21,.9);box-shadow:0 30px 100px #0008;padding:28px}.brand{font-size:11px;font-weight:900;letter-spacing:.16em;color:#c084fc;text-transform:uppercase}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:28px}.top h1{margin:7px 0;font-size:34px}.muted{color:#aaa2b1;font-size:13px;line-height:1.7}.btn{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fff;padding:11px 15px;border-radius:11px;font-weight:900;font-size:11px;cursor:pointer}.primary{background:linear-gradient(135deg,#9b5cff,#7040c9);border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin:15px 0}.field label{display:block;color:#aaa2b1;font-size:10px;font-weight:900;letter-spacing:.08em;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:13px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:#0a0810;color:#fff;outline:0}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9b5cff}.full{grid-column:1/-1}.drop{border:1px dashed rgba(155,92,255,.35);border-radius:15px;padding:18px;background:rgba(155,92,255,.04)}.status{margin-top:15px;padding:12px;border-radius:11px;font-size:11px;display:none}.success{display:block;background:rgba(101,230,160,.08);color:#9dffc6}.error{display:block;background:rgba(255,107,138,.08);color:#ff9aae}.catalog{margin-top:28px}.item{display:flex;align-items:center;gap:14px;padding:14px;border-top:1px solid rgba(255,255,255,.07)}.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#14101c}.pill{margin-left:auto;padding:6px 9px;border-radius:999px;background:rgba(155,92,255,.1);font-size:9px;font-weight:900;color:#c9b2ff}.login{max-width:430px;margin:80px auto}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start}.top h1{font-size:28px}}
</style>
</head>
<body><div class="wrap"><main class="panel" id="app"></main></div>
<script>
const API=window.MYTHICAL_STORE_API||"https://api.mythicalstudios.online";
const app=document.getElementById("app");
let token=sessionStorage.getItem("mythical_admin_token");

function login(){
 app.innerHTML='<div class="login"><div class="brand">MYTHICAL STUDIOS / ADMIN</div><h1>Store Control Center</h1><p class="muted">Add ranks, schematics and server-development products directly from here.</p><form id="loginForm"><div class="field"><label>USERNAME</label><input id="username" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%">Sign in</button><div id="loginStatus" class="status"></div></form></div>';
 document.getElementById("loginForm").onsubmit=async e=>{
  e.preventDefault();const status=document.getElementById("loginStatus");
  try{const r=await fetch(API+"/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Login failed");sessionStorage.setItem("mythical_admin_token",d.token);token=d.token;dashboard()}catch(err){status.textContent=err.message;status.className="status error"}
 }
}
async function dashboard(){
 app.innerHTML='<div class="top"><div><div class="brand">MYTHICAL STUDIOS / ADMIN</div><h1>Store Control Center</h1><div class="muted">Create a product and publish it to the store.</div></div><button class="btn" id="logout">Log out</button></div><form id="productForm" enctype="multipart/form-data"><div class="grid"><div class="field"><label>CATEGORY</label><select name="category" required><option value="ranks">MC Ranks</option><option value="schematic">Schematics</option><option value="development">Server Development</option></select></div><div class="field"><label>TITLE</label><input name="title" placeholder="e.g. LEGENDARY SCHEMATIC" required></div><div class="field"><label>PRICE (INR)</label><input name="price" type="number" min="0" step="1" placeholder="499" required></div><div class="field"><label>PRODUCT IMAGE</label><div class="drop"><input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div></div><div class="field full"><label>PRODUCT / SCHEMATIC / FILE</label><div class="drop"><input name="file" type="file" accept=".schem,.schematic,.litematic,.zip,.rar,.mcworld,.mcpack,.pdf,.png,.jpg,.jpeg,.webp"></div></div><div class="field full"><label>DESCRIPTION</label><textarea name="description" placeholder="Describe what the customer receives..."></textarea></div><div class="field full"><label>FEATURES — ONE PER LINE</label><textarea name="features" placeholder="Premium access\nInstant delivery\nExclusive perks"></textarea></div></div><button class="btn primary" type="submit">＋ Add Product & Publish</button><div id="status" class="status"></div></form><div class="catalog"><div class="brand">CURRENT CATALOGUE</div><div id="catalogList" class="muted" style="margin-top:10px">Loading...</div></div>';
 document.getElementById("logout").onclick=async()=>{try{await fetch(API+"/api/admin/logout",{method:"POST",headers:{Authorization:"Bearer "+token}})}catch{}sessionStorage.removeItem("mythical_admin_token");token=null;login()};
 document.getElementById("productForm").onsubmit=submitProduct;
 loadCatalog();
}
async function submitProduct(e){
 e.preventDefault();const status=document.getElementById("status");status.className="status";status.textContent="Publishing product...";
 const fd=new FormData(e.target);
 try{const r=await fetch(API+"/api/admin/products",{method:"POST",headers:{Authorization:"Bearer "+token},body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||"Publish failed");status.textContent="✓ Published "+d.product.title+(d.discordNotified?" — Discord announcement sent.":" — Discord announcement could not be sent.");status.className="status success";e.target.reset();loadCatalog()}catch(err){status.textContent=err.message;status.className="status error"}
}
async function loadCatalog(){
 const el=document.getElementById("catalogList");if(!el)return;
 try{const r=await fetch(API+"/api/admin/products",{headers:{Authorization:"Bearer "+token}});if(!r.ok)throw new Error("Could not load catalogue");const items=await r.json();el.innerHTML=items.map(p=>'<div class="item">'+(p.image?'<img class="thumb" src="'+p.image+'">':'<div class="thumb"></div>')+'<div><b>'+escapeHtml(p.title)+'</b><div class="muted">₹'+Number(p.price).toLocaleString("en-IN")+' · '+escapeHtml(p.category)+'</div></div><span class="pill">LIVE</span></div>').join("")||"No products yet."}catch(e){el.textContent=e.message}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c]))}
token?dashboard():login();
</script>
</body></html>
