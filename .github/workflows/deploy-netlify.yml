name: Deploy Mythical Studios store to Netlify

on:
  push:
    branches:
      - Master
    paths:
      - "store/**"
      - "netlify/**"
      - "netlify.toml"
      - "package.json"
      - ".github/workflows/deploy-netlify.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Netlify CLI
        run: npm install --global netlify-cli
      - name: Deploy site and Tebex functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in GitHub Actions secrets."
            exit 1
          fi
          netlify deploy --prod --dir=. --functions=netlify/functions --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
