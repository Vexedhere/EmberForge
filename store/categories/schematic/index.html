<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(700px 400px at 10% 0,#9b5cff20,transparent 65%),#06050a;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 30px));margin:auto;padding:55px 0 80px}.brand{font-size:10px;letter-spacing:.18em;color:#c084fc;font-weight:900}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:12px 0 28px}.icon{font-size:45px}h1{font-size:42px;margin:8px 0}p{color:#a9a1b3;font-size:12px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid #ffffff12;border-radius:18px;overflow:hidden;background:#0d0a14;cursor:pointer;transition:transform .18s,border-color .18s}.card:hover{transform:translateY(-3px);border-color:#9b5cff66}.pic{height:150px;display:grid;place-items:center;background:#120d19;font-size:48px}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.num{font-size:9px;color:#9b5cff;font-weight:950;letter-spacing:.14em;margin-bottom:5px}.title{font-weight:950}.desc{min-height:50px}.price{color:#f4c95d;font-weight:950;font-size:20px}.btn{display:block;margin-top:12px;text-align:center;padding:10px;border-radius:10px;background:#9b5cff18;border:1px solid #9b5cff44;color:#fff;text-decoration:none;font-size:10px;font-weight:900}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}.filters label{display:flex;align-items:center;gap:7px;color:#8f879a;font-size:10px;font-weight:800}.filters select{background:#0d0a14;color:#fff;border:1px solid #ffffff18;border-radius:10px;padding:9px 11px;outline:none}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{padding:9px 12px;border:1px solid #ffffff12;border-radius:10px;color:#aaa1b4;text-decoration:none;font-size:10px;font-weight:900}.empty{text-align:center;border:1px dashed #ffffff18;border-radius:18px;padding:60px 20px;color:#a9a1b3}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.modalBox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#0d0a14;border:1px solid #ffffff18;border-radius:22px;box-shadow:0 20px 80px #000;position:relative}.modalImg{height:280px;background:#120d19}.modalImg img{width:100%;height:100%;object-fit:cover}.modalBody{padding:24px}.close{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:1px solid #ffffff22;background:#08070cdd;color:#fff;font-size:20px;cursor:pointer}.modalTitle{font-size:28px;font-weight:950;margin:4px 0 10px}.modalDesc{color:#b9b0c2;font-size:13px;line-height:1.8}.modalPrice{color:#f4c95d;font-size:24px;font-weight:950;margin:15px 0}.buy{display:block;text-align:center;padding:14px;border-radius:12px;background:#9b5cff;color:#fff;text-decoration:none;font-size:12px;font-weight:950;border:0;cursor:pointer;width:100%}.buy:disabled{opacity:.6;cursor:wait}.meta{font-size:10px;color:#80788c;margin-top:10px;text-align:center}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.modalImg{height:200px}}

<body><main class="wrap"><div class="brand">MYTHICAL STUDIOS / STORE</div><div class="top"><div><div class="icon">🧱</div><h1>Schematics</h1><p>Premium Minecraft builds, ordered exactly from 001 to 020.</p></div><div class="nav"><a href="/">← Store Home</a><a href="/store/categories/development/">Server Development</a></div></div><div class="filters"><label>Price <select id="priceFilter"><option value="all">Any price</option><option value="0-499">₹0 – ₹499</option><option value="500-999">₹500 – ₹999</option><option value="1000+">₹1,000+</option></select></label><label>Type <select id="paidFilter"><option value="all">All</option><option value="paid">Paid only</option></select></label></div><section id="products"><div class="empty">Loading resources...</div></section></main>

const ITEMS=[
["001","Fantasy Kingdom Spawn","A premium fantasy kingdom spawn build.","5.99","7721409"],
["002","Roman Colosseum","A grand Roman-style Minecraft colosseum.","4.99","7721410"],
["003","Merchant Marketplace","A polished marketplace for trading and server hubs.","3.99","7721411"],
["004","Sky Islands Lobby","A floating-islands lobby designed for Minecraft networks.","5.49","7721418"],

["007","Void Abyss","A dark floating-island BedWars environment.","6.49","7721425"],
["008","Dwarven Mines BedWars","A dwarven underground BedWars map.","5.99","7721426"],
["009","Sakura Islands","A Japanese sakura-themed island build.","4.99","7721427"],
["010","Desert Pharaoh","A desert pharaoh / Egyptian-themed build.","5.49","7721428"],
["011","Starter Base Village","A ready-to-use starter survival village.","2.99","7721430"],

["013","Survival Trading Hall","A compact survival trading hall.","3.99","7721434"],
["014","Automatic Farm District","A district designed for automatic farms.","4.49","7721436"],
["015","Mountain Kingdom","A mountain kingdom survival build.","5.99","7721437"],
["016","Japanese Survival Village","A Japanese-style survival village.","5.49","7721438"],
["017","Underground Bunker","A secure underground survival bunker.","4.49","7721441"],
["018","Giant Treehouse Base","A giant treehouse survival base.","4.49","7721442"],
["019","Ocean Monument Base","An ocean monument-inspired base.","5.99","7721459"],
["020","Nether Fortress Base","A Nether fortress survival base.","6.49","7721460"]
].map(x=>({n:x[0],title:x[1],desc:x[2],price:x[3],packageId:x[4]}));
let selected=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function renderItems(items,box){box.className="grid";box.innerHTML=items.map(p=>'<article class="card" data-n="'+p.n+'"><div class="pic">🧱</div><div class="body"><div class="num">'+p.n+'</div><div class="title">'+esc(p.title)+'</div><p class="desc">'+esc(p.desc)+'</p><div class="price">$'+p.price+' USD</div><div class="btn">View Details</div></div></article>').join("");box.querySelectorAll(".card").forEach(c=>c.onclick=()=>openModal(ITEMS.find(p=>p.n===c.dataset.n)))}
function openModal(p){selected=p;document.getElementById("modalNum").textContent=p.n;document.getElementById("modalTitle").textContent=p.title;document.getElementById("modalDesc").textContent=p.desc;document.getElementById("modalPrice").textContent="$"+p.price+" USD";document.getElementById("modalImg").innerHTML='<div style="height:100%;display:grid;place-items:center;font-size:80px">🧱</div>';const b=document.getElementById("buyBtn");b.textContent="BUY NOW — TEBEX";b.disabled=false;document.getElementById("productModal").classList.add("open");document.getElementById("productModal").setAttribute("aria-hidden","false")}
async function buySelected(){if(!selected)return;const b=document.getElementById("buyBtn");b.disabled=true;b.textContent="OPENING TEBEX…";try{const r=await fetch("/.netlify/functions/tebex-checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({packageId:selected.packageId})});const j=await r.json();if(!r.ok||!j.checkout)throw Error(j.error||"Could not start Tebex checkout.");window.location.href=j.checkout}catch(e){alert(e.message||"Could not start checkout.");b.disabled=false;b.textContent="BUY NOW — TEBEX"}}
document.getElementById("buyBtn").onclick=buySelected;
document.getElementById("closeModal").onclick=()=>document.getElementById("productModal").classList.remove("open");
document.getElementById("productModal").onclick=e=>{if(e.target.id==="productModal")document.getElementById("productModal").classList.remove("open")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("productModal").classList.remove("open")});
function filtered(){const price=document.getElementById("priceFilter").value,paid=document.getElementById("paidFilter").value;return ITEMS.filter(p=>{const n=Number(p.price);const priceOk=price==="all"||(price==="0-499"&&n<5)||(price==="500-999"&&n>=5&&n<10)||(price==="1000+"&&n>=10);const paidOk=paid!=="free";return priceOk&&paidOk})}
document.getElementById("priceFilter").onchange=()=>renderItems(filtered(),document.getElementById("products"));
document.getElementById("paidFilter").onchange=()=>renderItems(filtered(),document.getElementById("products"));
renderItems(filtered(),document.getElementById("products"));
</script>
<script>
const SUPABASE_URL="https://nzaelikbjumaidaombmp.supabase.co";const SUPABASE_KEY="sb_publishable_xI4i15jxoh44D8USeKLLKQ_daeg0gtt";
const TEBEX_IDS=["7721409","7721410","7721411","7721418","7721419","7721423","7721425","7721426","7721427","7721428","7721430","7721431","7721434","7721436","7721437","7721438","7721441","7721442","7721459","7721460"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const orderOf=p=>{const s=String(p.file_path||"")+" "+String(p.title||"");const m=s.match(/(?:^|\D)(\d{3})(?:[_\-\s]|$)/);return m?Number(m[1]):999999};
let allItems=[];let selected=null;
function filtered(){const price=document.getElementById("priceFilter").value,paid=document.getElementById("paidFilter").value;return allItems.filter(p=>{const n=Number(p.price)||0;const priceOk=price==="all"||(price==="free"&&n===0)||(price==="0-499"&&n>=0&&n<=499)||(price==="500-999"&&n>=500&&n<=999)||(price==="1000+"&&n>=1000);const paidOk=paid==="all"||(paid==="free"&&n===0)||(paid==="paid"&&n>0);return priceOk&&paidOk})}
function packageId(p){const n=orderOf(p);return n>=1&&n<=20?TEBEX_IDS[n-1]:null}
function renderItems(items,box){if(!items.length){box.className="empty";box.innerHTML='<div style="font-size:45px">🔎</div><h2>No matching resources</h2><p>Try changing the price or paid/free filters.</p>';return}box.className="grid";box.innerHTML=items.map(p=>{const n=orderOf(p),paid=Number(p.price)>0;return '<article class="card" data-id="'+esc(p.id||"")+'"><div class="pic">'+(p.image?'<img src="'+esc(p.image)+'" alt="">':'🧱')+'</div><div class="body"><div class="num">'+(n<1000?String(n).padStart(3,"0"):"")+'</div><div class="title">'+esc(p.title)+'</div><p class="desc">'+esc(p.description||"Premium Mythical Studios resource.")+'</p><div class="price">'+(Number(p.price)===0?"Free":"₹"+Number(p.price).toLocaleString("en-IN"))+'</div><div class="btn">View Details</div></div></article>'}).join("");box.querySelectorAll(".card").forEach(c=>c.onclick=()=>openModal(allItems.find(p=>String(p.id||"")===c.dataset.id)))}
function openModal(p){if(!p)return;selected=p;const n=orderOf(p);document.getElementById("modalNum").textContent=n<1000?String(n).padStart(3,"0"):"";document.getElementById("modalTitle").textContent=p.title||"Schematic";document.getElementById("modalDesc").textContent=p.description||"Premium Mythical Studios resource.";document.getElementById("modalPrice").textContent=Number(p.price)===0?"Free":"₹"+Number(p.price).toLocaleString("en-IN");document.getElementById("modalImg").innerHTML=p.image?'<img src="'+esc(p.image)+'" alt="">':'<div style="height:100%;display:grid;place-items:center;font-size:70px">🧱</div>';const b=document.getElementById("buyBtn");b.textContent=Number(p.price)>0?"BUY NOW — TEBEX":"FREE DOWNLOAD";b.disabled=false;document.getElementById("productModal").classList.add("open");document.getElementById("productModal").setAttribute("aria-hidden","false")}
async function buySelected(){if(!selected)return;if(Number(selected.price)===0){if(selected.file)window.open(selected.file,"_blank");return}const id=packageId(selected);if(!id){alert("This schematic is missing its Tebex package mapping.");return}const b=document.getElementById("buyBtn");b.disabled=true;b.textContent="OPENING TEBEX…";try{const r=await fetch("/.netlify/functions/tebex-checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({packageId:id})});const j=await r.json();if(!r.ok||!j.checkout)throw Error(j.error||"Could not start Tebex checkout.");window.location.href=j.checkout}catch(e){alert(e.message||"Could not start checkout.");b.disabled=false;b.textContent="BUY NOW — TEBEX"}}
document.getElementById("buyBtn").onclick=buySelected;document.getElementById("closeModal").onclick=()=>document.getElementById("productModal").classList.remove("open");document.getElementById("productModal").onclick=e=>{if(e.target.id==="productModal")document.getElementById("productModal").classList.remove("open")};document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("productModal").classList.remove("open")});
async function load(){const box=document.getElementById("products");try{const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data,error}=await sb.from("products").select("*").eq("published",true).eq("category","schematic");if(error)throw error;allItems=(data||[]).map(p=>({...p,image:p.image_path?sb.storage.from("store-resources").getPublicUrl(p.image_path).data.publicUrl:"",file:p.file_path?sb.storage.from("store-resources").getPublicUrl(p.file_path).data.publicUrl:"",price:Number(p.price||0)})).sort((a,b)=>orderOf(a)-orderOf(b));if(!allItems.length){box.innerHTML='<div class="empty"><div style="font-size:45px">🧱</div><h2>No resources yet</h2><p>New resources will appear here when published by Mythical Studios.</p></div>';return}renderItems(filtered(),box)}catch(e){box.innerHTML='<div class="empty"><h2>Store temporarily unavailable</h2><p>'+esc(e.message||"Please try again shortly.")+'</p></div>'}}
document.getElementById("priceFilter").onchange=()=>renderItems(filtered(),document.getElementById("products"));document.getElementById("paidFilter").onchange=()=>renderItems(filtered(),document.getElementById("products"));load();
</script></body></html>
