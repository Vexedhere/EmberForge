<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mythical Studios — Schematics</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(700px 400px at 10% 0,#9b5cff20,transparent 65%),#06050a;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 30px));margin:auto;padding:55px 0 80px}.brand{font-size:10px;letter-spacing:.18em;color:#c084fc;font-weight:900}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:12px 0 28px}.icon{font-size:45px}h1{font-size:42px;margin:8px 0}p{color:#a9a1b3;font-size:12px;line-height:1.8}.back{color:#c084fc;text-decoration:none;font-size:11px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid #ffffff12;border-radius:18px;overflow:hidden;background:#0d0a14}.pic{height:150px;display:grid;place-items:center;background:#120d19;font-size:48px}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.title{font-weight:950}.desc{min-height:50px}.price{color:#f4c95d;font-weight:950;font-size:20px}.btn{display:block;margin-top:12px;text-align:center;padding:10px;border-radius:10px;background:#9b5cff18;border:1px solid #9b5cff44;color:#fff;text-decoration:none;font-size:10px;font-weight:900}.empty{text-align:center;border:1px dashed #ffffff18;border-radius:18px;padding:60px 20px;color:#a9a1b3}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}.filters label{display:flex;align-items:center;gap:7px;color:#8f879a;font-size:10px;font-weight:800}.filters select{background:#0d0a14;color:#fff;border:1px solid #ffffff18;border-radius:10px;padding:9px 11px;outline:none}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{padding:9px 12px;border:1px solid #ffffff12;border-radius:10px;color:#aaa1b4;text-decoration:none;font-size:10px;font-weight:900}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}}
</style></head>
<body><main class="wrap"><div class="brand">MYTHICAL STUDIOS / STORE</div><div class="top"><div><div class="icon">🧱</div><h1>Schematics</h1><p>Resources published through the Mythical Studios control center appear here automatically.</p></div><div class="nav"><a href="/">← Store Home</a><a href="/store/categories/development/">Server Development</a></div></div><div class="filters"><label>Price <select id="priceFilter"><option value="all">Any price</option><option value="free">Free</option><option value="0-499">₹0 – ₹499</option><option value="500-999">₹500 – ₹999</option><option value="1000+">₹1,000+</option></select></label><label>Type <select id="paidFilter"><option value="all">All</option><option value="free">Free only</option><option value="paid">Paid only</option></select></label></div><section id="products"><div class="empty">Loading resources...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://nzaelikbjumaidaombmp.supabase.co";const SUPABASE_KEY="sb_publishable_xI4i15jxoh44D8USeKLLKQ_daeg0gtt";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let allItems=[];
function filtered(){
 const price=document.getElementById("priceFilter").value, paid=document.getElementById("paidFilter").value;
 return allItems.filter(p=>{
  const n=Number(p.price)||0;
  const priceOk=price==="all"||(price==="free"&&n===0)||(price==="0-499"&&n>=0&&n<=499)||(price==="500-999"&&n>=500&&n<=999)||(price==="1000+"&&n>=1000);
  const paidOk=paid==="all"||(paid==="free"&&n===0)||(paid==="paid"&&n>0);
  return priceOk&&paidOk;
 });
}
function renderItems(items,box){
 if(!items.length){box.className="empty";box.innerHTML='<div style="font-size:45px">🔎</div><h2>No matching resources</h2><p>Try changing the price or paid/free filters.</p>';return}
 box.className="grid";box.innerHTML=items.map(p=>'<article class="card"><div class="pic">'+(p.image?'<img src="'+esc(p.image)+'" alt="">':'🧱')+'</div><div class="body"><div class="title">'+esc(p.title)+'</div><p class="desc">'+esc(p.description||"Premium Mythical Studios resource.")+'</p><div class="price">'+(Number(p.price)===0?"Free":"₹"+Number(p.price).toLocaleString("en-IN"))+'</div>'+(p.file?'<a class="btn" href="'+esc(p.file)+'" target="_blank">View / Download</a>':'<a class="btn" href="https://discord.gg/tzVTqK8Yt" target="_blank">Contact on Discord</a>')+'</div></article>').join("");
}

async function load(){const box=document.getElementById("products");try{const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data,error}=await sb.from("products").select("*").eq("published",true).neq("category","ranks").eq("category","schematic").order("created_at",{ascending:false});if(error)throw error;allItems=(data||[]).map(p=>({...p,image:p.image_path?sb.storage.from("store-resources").getPublicUrl(p.image_path).data.publicUrl:"",file:p.file_path?sb.storage.from("store-resources").getPublicUrl(p.file_path).data.publicUrl:"",price:Number(p.price||0)}));if(!allItems.length){box.innerHTML='<div class="empty"><div style="font-size:45px">🧱</div><h2>No resources yet</h2><p>New resources will appear here when published by Mythical Studios.</p></div>';return}renderItems(filtered(),box);}catch(e){box.innerHTML='<div class="empty"><h2>Store temporarily unavailable</h2><p>'+esc(e.message||"Please try again shortly.")+'</p></div>'}}document.getElementById("priceFilter").onchange=()=>renderItems(filtered(),document.getElementById("products"));document.getElementById("paidFilter").onchange=()=>renderItems(filtered(),document.getElementById("products"));load();
</script></body></html>
